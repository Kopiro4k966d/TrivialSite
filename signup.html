<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080b"><title>Регистрация — Decide Visuals</title><link rel="icon" href="/img/decide-mark-v3.png?v=4"><link rel="stylesheet" href="/css/decide-v7.css?v=7"></head>
<body class="inner-page">
<a class="auth-back" href="/">На главную</a>
<main class="auth-page"><section class="auth-shell auth-minimal reveal"><div class="auth-form-wrap">
<div class="auth-brand-center"><a class="brand" href="/"><img src="/img/decide-mark-v3.png?v=4" alt=""><span>Decide Visuals</span></a></div>
<h1>Регистрация</h1><p>Создайте аккаунт Decide Visuals. Ключ активируется уже внутри профиля.</p>
<form id="signupForm" class="form-grid">
<div class="field"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" placeholder="Придумайте логин"></div>
<div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="name@example.com"></div>
<div class="field"><label for="password">Пароль</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="Минимум 8 символов"><button class="password-toggle" type="button" aria-label="Показать пароль">●</button></div></div>
<div class="field"><label for="passwordConfirm">Повторите пароль</label><div class="password-wrap"><input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required minlength="8" placeholder="Повторите пароль"><button class="password-toggle" type="button" aria-label="Показать пароль">●</button></div></div>
<button class="btn btn-primary btn-block" type="submit">Создать аккаунт</button><p class="status-message" id="formStatus" aria-live="polite"></p></form>
<p class="auth-switch">Уже есть аккаунт? <a href="/signin">Войти</a></p><div class="auth-note">Decide Visuals</div>
</div></section></main>
<script src="/js/api.js"></script><script src="/js/form-anim.js"></script><script src="/js/auth.js"></script><script src="/js/perfomance.js"></script><script src="/js/ui-v7.js?v=7"></script>
</body></html>
