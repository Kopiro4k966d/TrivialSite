<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080b"><title>Регистрация — Decide Visuals</title><link rel="icon" href="/img/logo.svg"><link rel="stylesheet" href="/css/app.css"></head>
<body class="inner-page"><header class="site-header"><div class="header-shell"><a class="brand" href="/"><img src="/img/logo.svg" alt=""><span>Decide Visuals</span></a><nav class="nav-links"><a href="/">Главная</a><a href="/purchase">Покупка</a></nav><div class="header-actions"><a class="home-login" href="/signin">Войти</a><button class="menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false"><span></span><span></span></button></div></div></header>
<main class="auth-page"><section class="auth-shell reveal"><div class="auth-art"><div class="auth-mark"><img src="/img/logo.svg" alt="">Decide Visuals</div><div><h2>Один аккаунт для всего доступа.</h2><p>Активируйте ключ, следите за подпиской и скачивайте актуальную версию лаунчера.</p></div><span class="eyebrow">Create account</span></div><div class="auth-form-wrap"><h1>Регистрация</h1><p>Создайте аккаунт Decide Visuals.</p><form id="signupForm" class="form-grid"><div class="field"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" placeholder="decide_user"></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="name@example.com"></div><div class="field"><label for="password">Пароль</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="Минимум 8 символов"><button class="password-toggle" type="button" aria-label="Показать пароль">●</button></div></div><div class="field"><label for="passwordConfirm">Повторите пароль</label><div class="password-wrap"><input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required minlength="8" placeholder="Повторите пароль"><button class="password-toggle" type="button" aria-label="Показать пароль">●</button></div></div><button class="btn btn-primary btn-block" type="submit">Создать аккаунт</button><p class="status-message" id="formStatus" aria-live="polite"></p></form><p class="auth-switch">Уже есть аккаунт? <a href="/signin">Войти</a></p></div></section></main>
<script src="/js/api.js"></script><script src="/js/header.js"></script><script src="/js/form-anim.js"></script><script src="/js/auth.js"></script><script src="/js/perfomance.js"></script></body></html>
