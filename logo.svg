:root{
  --bg:#08080b;
  --bg-soft:#0d0d12;
  --panel:#111118;
  --panel-2:#15151d;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.14);
  --text:#f6f2ff;
  --muted:#a7a2b2;
  --muted-2:#777281;
  --accent:#cf8dff;
  --accent-2:#9e72ff;
  --accent-soft:rgba(202,139,255,.14);
  --success:#79e3aa;
  --danger:#ff8f9d;
  --shadow:0 24px 80px rgba(0,0,0,.44);
  --radius:20px;
  --shell:1160px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background:radial-gradient(circle at 50% -10%,rgba(157,102,255,.09),transparent 40%),linear-gradient(180deg,#09090d 0,#08080b 62%,#09090d 100%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1000;opacity:.13;background-image:url('/img/grid.svg');mask-image:linear-gradient(to bottom,black,transparent 42%)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{color:inherit}
img{max-width:100%;display:block}
.container{width:min(var(--shell),calc(100% - 40px));margin-inline:auto}
.eyebrow,.pill{display:inline-flex;align-items:center;gap:8px;width:max-content;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);color:#dcd5ea;font-size:12px;line-height:1;font-weight:700;letter-spacing:.02em}
.eyebrow::before,.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px var(--accent)}
.muted{color:var(--muted)}
.accent{color:var(--accent)}
.hidden{display:none!important}

/* Header */
.site-header{position:fixed;left:0;right:0;top:16px;z-index:90;padding:0 20px;transition:.3s ease}
.header-shell{width:min(900px,100%);min-height:54px;margin:auto;padding:8px 10px 8px 14px;border:1px solid rgba(255,255,255,.085);border-radius:999px;background:rgba(15,15,21,.72);backdrop-filter:blur(20px) saturate(140%);box-shadow:0 10px 45px rgba(0,0,0,.2);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;transition:.3s ease}
.site-header.is-scrolled .header-shell{background:rgba(10,10,14,.9);border-color:rgba(255,255,255,.12);transform:translateY(-3px)}
.brand{display:inline-flex;align-items:center;gap:10px;min-width:max-content;font-size:14px;font-weight:750;letter-spacing:-.02em}
.brand img{width:22px;height:22px}
.brand span{white-space:nowrap}
.nav-links{display:flex;align-items:center;gap:6px}
.nav-links a{padding:10px 12px;border-radius:999px;color:#a9a4b4;font-size:12px;font-weight:650;transition:.2s ease}
.nav-links a:hover,.nav-links a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.055)}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.header-actions>a,.header-actions>button{border:0}
.home-login{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 15px;border-radius:12px;background:linear-gradient(135deg,#d99cff,#b479ff);color:#161019;font-size:12px;font-weight:800;box-shadow:0 10px 25px rgba(188,120,255,.16);transition:.2s ease}
.home-login:hover{transform:translateY(-1px);filter:brightness(1.05)}
.menu-toggle{display:none;width:40px;height:36px;border-radius:12px;background:transparent;border:1px solid var(--line)!important;cursor:pointer;position:relative}
.menu-toggle span{position:absolute;left:11px;right:11px;height:1px;background:#fff;transition:.2s ease}
.menu-toggle span:first-child{top:13px}.menu-toggle span:last-child{top:21px}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line-strong);background:#121219;color:#f5f1fa;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:13px;font-weight:760;font-size:13px;cursor:pointer;transition:.2s ease}
.btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22);background:#171720}
.btn-primary{background:linear-gradient(135deg,#d69aff,#ad78ff);border-color:transparent;color:#160f1b;box-shadow:0 16px 44px rgba(184,118,255,.2)}
.btn-primary:hover{filter:brightness(1.04);background:linear-gradient(135deg,#dda9ff,#b986ff)}
.btn-block{width:100%}.btn:disabled,.btn.is-disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.copy-btn{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:12px;cursor:pointer;padding:6px 0}

/* Reveal animation */
[data-reveal],.reveal{opacity:0;transform:translateY(28px) scale(.985);filter:blur(6px);transition:opacity .78s cubic-bezier(.2,.7,.2,1),transform .78s cubic-bezier(.2,.7,.2,1),filter .78s ease;transition-delay:var(--delay,0ms)}
[data-reveal].is-revealed,.reveal.is-visible{opacity:1;transform:none;filter:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal],.reveal{opacity:1;transform:none;filter:none;transition:none!important}.hero-orb,.ambient-beam{animation:none!important}}

/* Home */
.home-main{overflow:hidden}
.hero{min-height:100svh;position:relative;display:flex;align-items:center;padding:140px 0 96px;border-bottom:1px solid var(--line)}
.hero-backdrop{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 49% 10%,rgba(227,206,255,.25),transparent 24%),radial-gradient(ellipse at 54% 32%,rgba(118,70,255,.24),transparent 34%),linear-gradient(180deg,#15121c 0,#0a0910 68%,#08080b 100%)}
.hero-backdrop::before{content:"";position:absolute;width:125vw;height:50vw;min-height:460px;left:-22vw;top:-15vw;border-radius:50%;border:58px solid rgba(255,255,255,.78);filter:blur(24px);transform:rotate(-13deg);box-shadow:0 0 80px rgba(211,157,255,.65),0 0 160px rgba(147,88,255,.32) inset;opacity:.65}
.hero-backdrop::after{content:"";position:absolute;width:70vw;height:34vw;right:-30vw;top:8vw;border-radius:50%;background:rgba(244,237,255,.85);filter:blur(36px);transform:rotate(-11deg);box-shadow:0 0 80px rgba(181,122,255,.42);opacity:.56}
.hero-orb{position:absolute;border-radius:50%;filter:blur(50px);opacity:.32;animation:floatOrb 10s ease-in-out infinite alternate}.hero-orb.one{width:360px;height:360px;background:#7443ff;left:8%;top:12%}.hero-orb.two{width:280px;height:280px;background:#e0b5ff;right:14%;top:22%;animation-delay:-4s}.hero-orb.three{width:420px;height:210px;background:#6861ff;left:42%;bottom:4%;animation-delay:-7s}
@keyframes floatOrb{to{transform:translate3d(28px,-24px,0) scale(1.08)}}
.hero-content{position:relative;z-index:2;text-align:center;max-width:820px;margin:auto;display:flex;flex-direction:column;align-items:center}
.hero .pill{margin-bottom:22px;background:rgba(15,14,21,.58);backdrop-filter:blur(12px)}
.hero h1{font-size:clamp(48px,7.2vw,96px);line-height:.97;letter-spacing:-.06em;margin:0;max-width:880px;font-weight:580;text-wrap:balance;text-shadow:0 2px 50px rgba(0,0,0,.45)}
.hero h1 span{color:#dcd3ff}
.hero p{max-width:600px;margin:24px auto 0;color:#c2bdca;font-size:16px;line-height:1.7;text-wrap:balance}
.hero-actions{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hero-scroll{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:9px;align-items:center;color:#8d8898;font-size:11px;text-transform:uppercase;letter-spacing:.14em}.hero-scroll i{width:28px;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}

.section{padding:108px 0;border-bottom:1px solid var(--line);position:relative}
.section-heading{text-align:center;max-width:700px;margin:0 auto 44px;display:flex;flex-direction:column;align-items:center}
.section-heading h2{font-size:clamp(34px,4vw,58px);line-height:1.03;letter-spacing:-.045em;margin:16px 0 0;font-weight:560;text-wrap:balance}
.section-heading p{margin:16px auto 0;max-width:520px;color:var(--muted);line-height:1.65;font-size:14px;text-wrap:balance}

.showcase{padding-top:92px;background:linear-gradient(180deg,#08080b,#0a0a0e 55%,#08080b)}
.showcase-frame{width:min(980px,100%);margin:auto;border:1px solid var(--line-strong);border-radius:24px;background:linear-gradient(180deg,#121219,#0c0c11);box-shadow:var(--shadow);overflow:hidden;position:relative}
.showcase-top{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#7e7989;font-size:11px}.window-controls{display:flex;gap:7px}.window-controls i{width:8px;height:8px;border-radius:50%;background:#5c5965}.showcase-brand{display:flex;gap:8px;align-items:center;color:#c9c4d2;font-weight:700}.showcase-brand img{width:17px;height:17px}
.showcase-body{display:grid;grid-template-columns:185px 1fr;min-height:440px}
.client-side{border-right:1px solid var(--line);padding:16px 12px;background:#0d0d12}.client-side strong{display:block;font-size:12px;margin:7px 8px 15px}.client-side button{width:100%;height:38px;border:0;border-radius:10px;background:transparent;color:#817c8c;text-align:left;padding:0 12px;font-size:12px;font-weight:650;cursor:pointer;transition:.2s ease}.client-side button:hover,.client-side button.active{background:rgba(207,141,255,.1);color:#f5efff}.client-side button.active{box-shadow:inset 2px 0 0 var(--accent)}
.client-canvas{position:relative;min-height:440px;overflow:hidden;background:radial-gradient(circle at 60% 22%,rgba(191,142,255,.28),transparent 28%),linear-gradient(145deg,#202032,#0d1015 62%,#121017)}
.client-canvas::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(4,4,7,.82)),repeating-linear-gradient(0deg,transparent 0 54px,rgba(255,255,255,.025) 55px),repeating-linear-gradient(90deg,transparent 0 68px,rgba(255,255,255,.02) 69px);opacity:.85}
.game-horizon{position:absolute;left:-6%;right:-6%;bottom:0;height:54%;background:linear-gradient(165deg,transparent 0 20%,#171920 20% 45%,#0b0d11 46%);clip-path:polygon(0 32%,15% 14%,31% 29%,45% 8%,64% 34%,80% 11%,100% 30%,100% 100%,0 100%)}
.game-glow{position:absolute;width:180px;height:180px;border-radius:50%;right:16%;top:14%;background:radial-gradient(circle,#f8e7ff 0,#d29aff 10%,rgba(180,119,255,.15) 36%,transparent 66%);filter:blur(2px);box-shadow:0 0 60px rgba(201,139,255,.26)}
.crosshair{position:absolute;left:57%;top:47%;width:26px;height:26px}.crosshair::before,.crosshair::after{content:"";position:absolute;background:#fff;opacity:.82}.crosshair::before{left:12px;top:3px;width:2px;height:20px}.crosshair::after{left:3px;top:12px;width:20px;height:2px}
.module-panel{position:absolute;left:22px;bottom:22px;width:260px;padding:16px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(13,13,18,.74);backdrop-filter:blur(16px)}.module-panel h3{font-size:13px;margin:0 0 12px}.module-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:#a8a3b2}.toggle-dot{width:28px;height:16px;border-radius:999px;background:#2b2933;padding:2px}.toggle-dot::after{content:"";display:block;width:12px;height:12px;border-radius:50%;background:#777280;transition:.2s}.toggle-dot.on{background:rgba(207,141,255,.28)}.toggle-dot.on::after{transform:translateX(12px);background:var(--accent);box-shadow:0 0 12px rgba(207,141,255,.65)}
.showcase-caption{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:22px 4px 0;width:min(980px,100%);margin:auto}.showcase-caption h3{margin:0;font-size:24px;letter-spacing:-.03em}.showcase-caption p{max-width:560px;margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.slider-dots{display:flex;gap:8px;padding-bottom:4px}.slider-dot{width:7px;height:7px;border-radius:50%;border:0;background:#47434f;cursor:pointer;padding:0}.slider-dot.active{width:22px;border-radius:999px;background:#eee9f5}

.metrics{background:#09090c}.metrics-shell{display:grid;grid-template-columns:1.05fr repeat(3,.7fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.015)}.metric-copy,.metric{padding:24px}.metric-copy{display:flex;flex-direction:column;gap:7px;justify-content:center}.metric-copy strong{font-size:15px}.metric-copy span{font-size:12px;color:var(--muted)}.metric{border-left:1px solid var(--line)}.metric strong{display:block;font-size:28px;letter-spacing:-.04em}.metric span{display:block;margin-top:5px;font-size:11px;color:var(--muted)}

.demo-section{overflow:hidden}.demo-shell{display:grid;grid-template-columns:.8fr 1.2fr;gap:60px;align-items:center}.demo-copy h2{font-size:clamp(36px,5vw,68px);line-height:1;letter-spacing:-.05em;margin:18px 0}.demo-copy p{color:var(--muted);font-size:14px;line-height:1.7;max-width:450px}.demo-list{margin-top:28px;border-top:1px solid var(--line)}.demo-list div{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:15px 0;border-bottom:1px solid var(--line);color:#d8d3df;font-size:13px}.demo-list span{color:var(--muted-2)}
.demo-card{min-height:520px;border:1px solid var(--line-strong);border-radius:24px;background:linear-gradient(150deg,#181520,#0b0b10);position:relative;overflow:hidden;box-shadow:var(--shadow)}.demo-card::before{content:"";position:absolute;width:380px;height:380px;border-radius:50%;background:rgba(171,104,255,.25);filter:blur(70px);top:-120px;right:-80px}.demo-card-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,black,transparent)}.demo-widget{position:absolute;border:1px solid var(--line);background:rgba(13,13,18,.78);backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 20px 45px rgba(0,0,0,.24)}.demo-widget.w1{left:34px;top:42px;width:54%;padding:20px}.demo-widget.w2{right:30px;top:200px;width:42%;padding:17px}.demo-widget.w3{left:60px;bottom:35px;width:60%;padding:18px}.widget-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#aaa4b4;margin-bottom:15px}.widget-title{font-size:17px;font-weight:700;letter-spacing:-.03em}.bar{height:5px;border-radius:99px;background:#26242d;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:72%}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.chips span{font-size:10px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;color:#aaa4b4}

.pricing-section{background:radial-gradient(circle at 50% 25%,rgba(177,111,255,.06),transparent 26%),#08080b}.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:stretch}.price-card{position:relative;border:1px solid var(--line);border-radius:18px;padding:24px;background:#0d0d12;display:flex;flex-direction:column;min-height:330px;transition:.25s ease}.price-card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.16);background:#101017}.price-card.featured{background:linear-gradient(180deg,rgba(203,138,255,.12),#101016 35%);border-color:rgba(207,141,255,.28)}.price-badge{position:absolute;right:16px;top:16px;padding:6px 8px;border-radius:999px;background:rgba(207,141,255,.12);color:#dca8ff;font-size:10px;font-weight:800}.price-card h3{margin:0;font-size:16px}.price-card>p{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0 0}.price-value{margin:34px 0 26px;display:flex;align-items:end;gap:7px}.price-value strong{font-size:36px;letter-spacing:-.04em}.price-value span{font-size:12px;color:var(--muted);padding-bottom:6px}.price-features{display:grid;gap:11px;margin-bottom:24px}.price-features span{font-size:11px;color:#c5bfcc;display:flex;gap:8px;align-items:center}.price-features span::before{content:"✓";color:var(--accent)}.price-card .btn{margin-top:auto}

.site-footer{padding:46px 0 34px;background:#08080b}.footer-grid{display:grid;grid-template-columns:1.2fr repeat(3,.6fr);gap:32px}.footer-brand p{max-width:300px;color:var(--muted);font-size:12px;line-height:1.65;margin:14px 0 0}.footer-col h4{margin:0 0 13px;font-size:11px;color:#f4eefb}.footer-col a,.footer-col span{display:block;color:#878290;font-size:11px;margin:9px 0}.footer-col a:hover{color:#fff}.footer-bottom{border-top:1px solid var(--line);margin-top:34px;padding-top:18px;display:flex;justify-content:space-between;gap:20px;color:#67636d;font-size:10px}

/* Inner pages */
.inner-page{min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(180,110,255,.07),transparent 30%),var(--bg)}
.inner-main{padding:118px 0 80px;min-height:calc(100vh - 90px)}
.page-heading{display:grid;grid-template-columns:1fr .8fr;gap:40px;align-items:end;padding:56px 0 34px;border-bottom:1px solid var(--line)}.page-heading h1{font-size:clamp(42px,6vw,78px);letter-spacing:-.055em;line-height:.98;margin:14px 0 0;font-weight:560}.page-heading>p{justify-self:end;max-width:430px;color:var(--muted);font-size:14px;line-height:1.7;margin:0}

/* Auth */
.auth-page{min-height:100vh;display:grid;place-items:center;padding:110px 20px 48px;position:relative;overflow:hidden}.auth-page::before{content:"";position:absolute;width:600px;height:600px;border-radius:50%;background:rgba(162,93,255,.15);filter:blur(100px);top:-350px;left:50%;transform:translateX(-50%)}.auth-shell{width:min(920px,100%);display:grid;grid-template-columns:.92fr 1.08fr;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#0c0c11;box-shadow:var(--shadow);position:relative;z-index:2}.auth-art{min-height:590px;padding:34px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 72% 15%,rgba(221,181,255,.38),transparent 18%),radial-gradient(circle at 35% 44%,rgba(134,83,255,.38),transparent 35%),linear-gradient(145deg,#15131d,#0c0b12)}.auth-art h2{font-size:42px;line-height:1.02;letter-spacing:-.05em;margin:0;max-width:350px;font-weight:550}.auth-art p{color:#aaa4b4;font-size:12px;line-height:1.6;max-width:330px}.auth-mark{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800}.auth-mark img{width:24px}.auth-form-wrap{padding:48px 44px;display:flex;flex-direction:column;justify-content:center}.auth-form-wrap h1{font-size:34px;letter-spacing:-.04em;margin:0}.auth-form-wrap>p{font-size:12px;color:var(--muted);margin:10px 0 28px}.form-grid{display:grid;gap:14px}.field{display:grid;gap:7px}.field label{font-size:11px;color:#aaa4b4;font-weight:650}.field input,.field select,.key-form input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#111118;color:#f6f2ff;padding:0 13px;outline:none;transition:.2s ease}.field input:focus,.field select:focus,.key-form input:focus{border-color:rgba(207,141,255,.55);box-shadow:0 0 0 3px rgba(207,141,255,.08)}.password-wrap{position:relative}.password-wrap input{padding-right:48px}.password-toggle{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:#888291;cursor:pointer}.form-meta{display:flex;justify-content:space-between;gap:15px;align-items:center;font-size:11px;color:var(--muted)}.form-meta a,.auth-switch a{color:#d7a0ff}.auth-switch{margin:20px 0 0;color:var(--muted);font-size:11px;text-align:center}.status-message{min-height:18px;font-size:11px;color:var(--muted);margin:2px 0 0}.status-message.error{color:var(--danger)}.status-message.success{color:var(--success)}

/* Purchase */
.price-page-grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:28px}.price-row{background:#0b0b10;display:grid;grid-template-columns:70px 1fr 190px 140px;gap:20px;align-items:center;padding:28px;transition:.2s ease}.price-row:hover{background:#0e0e14}.price-index{color:#66616e;font-size:11px}.price-name h2{margin:0;font-size:25px;letter-spacing:-.04em}.price-name p{margin:7px 0 0;color:var(--muted);font-size:11px}.price-cost strong{display:block;font-size:27px}.price-cost small{color:var(--muted);font-size:10px}.pricing-note{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:56px}.note-item{background:var(--bg);padding:24px}.note-item strong{display:block;font-size:12px}.note-item span{display:block;margin-top:8px;color:var(--muted);font-size:11px;line-height:1.6}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:120;display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:.25s}.modal-backdrop.open{opacity:1;visibility:visible}.payment-modal{width:min(480px,100%);border:1px solid var(--line-strong);border-radius:20px;background:#101016;padding:24px;box-shadow:var(--shadow);transform:translateY(14px) scale(.98);transition:.25s}.modal-backdrop.open .payment-modal{transform:none}.modal-head{display:flex;justify-content:space-between;gap:18px}.modal-head h2{margin:0;font-size:22px}.modal-head p{margin:7px 0 0;color:var(--muted);font-size:11px}.modal-close{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:#14141b;cursor:pointer;font-size:20px}.order-summary{margin:20px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.order-summary>div{border:1px solid var(--line);border-radius:12px;padding:14px}.order-summary span{display:block;color:var(--muted);font-size:10px}.order-summary strong{display:block;margin-top:5px}.payment-method{width:100%;border:1px solid var(--line);border-radius:12px;background:#111118;color:#fff;padding:13px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;margin:8px 0}.payment-method.selected{border-color:rgba(207,141,255,.42);background:rgba(207,141,255,.07)}.payment-method img{width:28px;height:28px;object-fit:contain}.payment-method strong,.payment-method small{display:block}.payment-method small{color:var(--muted);font-size:10px;margin-top:3px}.payment-hint{min-height:15px;color:#8e8898;font-size:10px;margin:10px 0 0}

/* Profile */
.profile-main{padding:118px 0 76px}.profile-top{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:42px 0 28px;border-bottom:1px solid var(--line)}.profile-top h1{font-size:42px;letter-spacing:-.045em;margin:13px 0 0}.profile-top p{color:var(--muted);font-size:12px;margin:8px 0 0}.profile-layout{display:grid;grid-template-columns:245px 1fr;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:24px;min-height:600px;background:#0b0b10}.profile-sidebar{border-right:1px solid var(--line);padding:20px;background:#0d0d12}.profile-identity{display:flex;gap:12px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}.avatar-wrap{position:relative}.avatar-wrap img{width:48px;height:48px;object-fit:cover;border-radius:14px;background:#16161e;border:1px solid var(--line)}.avatar-edit{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:7px;border:1px solid var(--line);background:#171720;color:#fff;font-size:12px;cursor:pointer}.profile-identity h2{margin:0;font-size:14px}.role{display:block;color:var(--muted);font-size:10px;margin-top:4px}.subscription-badge{margin:14px 0;padding:10px 12px;border-radius:10px;background:#13131a;color:#9a94a4;font-size:10px}.subscription-badge.active{background:rgba(121,227,170,.08);color:var(--success)}.side-nav{display:grid;gap:5px}.side-nav button,.side-nav a{width:100%;min-height:39px;border:0;border-radius:10px;background:transparent;color:#8e8999;text-align:left;padding:0 11px;font-size:11px;cursor:pointer;display:flex;align-items:center}.side-nav button.active,.side-nav button:hover,.side-nav a:hover{background:rgba(255,255,255,.045);color:#fff}.profile-panel{padding:32px}.panel-section{display:none}.panel-section.active{display:block;animation:panelIn .35s ease both}@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.panel-title{font-size:24px;margin:0 0 20px;letter-spacing:-.035em}.panel-copy{color:var(--muted);font-size:12px;line-height:1.65;max-width:600px;margin:-10px 0 24px}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat-card{border:1px solid var(--line);border-radius:13px;background:#0f0f15;padding:16px}.stat-card span{display:block;color:var(--muted);font-size:10px}.stat-card strong{display:block;margin-top:8px;font-size:14px}.details-list{margin-top:14px;border:1px solid var(--line);border-radius:13px;overflow:hidden}.detail-row{display:grid;grid-template-columns:140px 1fr auto;gap:15px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);font-size:11px}.detail-row:first-child{border-top:0}.detail-row>span{color:var(--muted)}.detail-row strong{overflow-wrap:anywhere}.download-panel{min-height:440px;border:1px solid var(--line);border-radius:16px;background:radial-gradient(circle at 80% 12%,rgba(192,126,255,.11),transparent 28%),#0f0f15;padding:34px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.download-mark{width:56px;height:56px;border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;background:#12121a;margin-bottom:20px}.download-mark img{width:30px}.download-panel h2{font-size:32px;margin:12px 0 8px}.download-panel p{color:var(--muted);font-size:12px}.download-panel small{margin-top:15px;color:#76717e;font-size:10px;max-width:420px;line-height:1.6}.key-form{display:flex;gap:10px}.key-form input{flex:1}.key-form .btn{min-width:140px}

/* Admin / State / Offer */
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.admin-card{border:1px solid var(--line);border-radius:16px;background:#0c0c11;padding:24px}.admin-card h3{margin:0 0 18px}.generated-key{margin:16px 0 5px;border:1px dashed rgba(207,141,255,.3);border-radius:10px;padding:14px;color:#e1b9ff;background:rgba(207,141,255,.04);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}.state-page{min-height:100vh;display:grid;place-items:center;padding:110px 20px 40px}.state-card{width:min(580px,100%);text-align:center;border:1px solid var(--line);border-radius:20px;background:#0d0d12;padding:42px}.state-icon{width:54px;height:54px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;background:rgba(121,227,170,.08);color:var(--success);font-size:25px}.state-code{font-size:10px;color:var(--muted)}.state-card h1{font-size:34px;letter-spacing:-.04em;margin:12px 0}.state-card p{color:var(--muted);font-size:12px;line-height:1.7}.state-actions{display:flex;justify-content:center;gap:10px;margin-top:24px}.legal{max-width:820px;margin:0 auto}.legal h1{font-size:46px;letter-spacing:-.045em;margin:30px 0}.legal h2{font-size:18px;margin:30px 0 10px}.legal p,.legal li{color:#9e99a7;font-size:12px;line-height:1.75}.legal ul{padding-left:20px}

/* 404 */
.notfound{min-height:100vh;display:grid;place-items:center;padding:110px 20px 40px;text-align:center}.notfound strong{display:block;font-size:clamp(110px,22vw,260px);line-height:.75;letter-spacing:-.08em;color:#14121a;text-shadow:0 0 80px rgba(185,117,255,.12)}.notfound h1{font-size:34px;margin:-10px 0 10px;letter-spacing:-.04em}.notfound p{color:var(--muted);font-size:12px;margin-bottom:24px}

@media(max-width:900px){
  .header-shell{grid-template-columns:1fr auto}.nav-links{position:absolute;top:64px;left:20px;right:20px;display:none;flex-direction:column;align-items:stretch;padding:10px;border:1px solid var(--line);border-radius:16px;background:rgba(10,10,14,.96);backdrop-filter:blur(18px)}.nav-links.is-open{display:flex}.nav-links a{padding:12px}.menu-toggle{display:block}.header-actions{grid-column:2}.header-actions .home-login{display:none}
  .hero{padding-top:130px}.showcase-body{grid-template-columns:145px 1fr}.module-panel{width:230px}
  .metrics-shell{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-left:1px solid var(--line)}.metric:nth-child(3){border-left:0;border-top:1px solid var(--line)}.metric:nth-child(4){border-top:1px solid var(--line)}
  .demo-shell{grid-template-columns:1fr}.demo-copy{max-width:650px}.pricing-grid{grid-template-columns:1fr}.price-card{min-height:0}.footer-grid{grid-template-columns:1fr 1fr}
  .auth-shell{grid-template-columns:1fr}.auth-art{display:none}.auth-form-wrap{padding:42px 28px}
  .page-heading{grid-template-columns:1fr}.page-heading>p{justify-self:start}.price-row{grid-template-columns:48px 1fr 150px}.price-row .btn{grid-column:2/4}.pricing-note{grid-template-columns:1fr}.profile-layout{grid-template-columns:1fr}.profile-sidebar{border-right:0;border-bottom:1px solid var(--line)}.side-nav{grid-template-columns:repeat(4,1fr)}.side-nav button,.side-nav a{text-align:center;justify-content:center}.admin-grid{grid-template-columns:1fr}
}
@media(max-width:620px){
  .container{width:min(100% - 24px,var(--shell))}.site-header{top:10px;padding:0 10px}.header-shell{min-height:50px;padding:6px 7px 6px 12px}.brand span{font-size:13px}
  .hero{min-height:780px;padding:120px 0 74px}.hero-backdrop::before{width:170vw;height:90vw;left:-60vw;top:-12vw;border-width:38px}.hero h1{font-size:52px}.hero p{font-size:14px}.hero-actions{width:100%}.hero-actions .btn{flex:1}.section{padding:78px 0}.section-heading{margin-bottom:30px}.section-heading h2{font-size:38px}
  .showcase-frame{border-radius:16px}.showcase-body{grid-template-columns:1fr;min-height:450px}.client-side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.client-side strong{display:none}.client-side button{white-space:nowrap;width:auto;padding:0 10px}.client-canvas{min-height:390px}.module-panel{left:14px;right:14px;bottom:14px;width:auto}.showcase-caption{grid-template-columns:1fr}.slider-dots{justify-content:flex-start}.metrics-shell{grid-template-columns:1fr}.metric{border-left:0!important;border-top:1px solid var(--line)!important}.metric-copy{border-top:0!important}.demo-card{min-height:440px}.demo-widget.w1{left:18px;top:24px;width:72%}.demo-widget.w2{right:18px;top:188px;width:58%}.demo-widget.w3{left:26px;bottom:24px;width:72%}
  .footer-grid{grid-template-columns:1fr 1fr}.footer-brand{grid-column:1/-1}.footer-bottom{flex-direction:column}
  .page-heading{padding-top:30px}.page-heading h1{font-size:48px}.price-row{grid-template-columns:1fr;gap:13px;padding:22px}.price-index{display:none}.price-row .btn{grid-column:auto}.pricing-note{margin-top:34px}
  .profile-top{align-items:flex-start;flex-direction:column}.profile-layout{margin-top:14px}.profile-sidebar{padding:14px}.side-nav{grid-template-columns:1fr 1fr}.profile-panel{padding:20px}.stats-grid{grid-template-columns:1fr}.detail-row{grid-template-columns:1fr auto}.detail-row>span{grid-column:1/-1}.key-form{flex-direction:column}.key-form .btn{width:100%}.download-panel{padding:24px}.auth-page{padding-top:90px}.auth-form-wrap{padding:34px 20px}.auth-form-wrap h1{font-size:30px}.state-card{padding:30px 20px}
}
