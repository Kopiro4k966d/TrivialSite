<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель — Trivial</title><link rel="icon" href="img/logo.png"><link rel="stylesheet" href="css/header.css"><link rel="stylesheet" href="css/main/profile.css"></head><body data-auth-required><header class="site-header"><div class="header-shell"><a class="brand" href="index.html"><img src="img/logo.png" alt=""><span>TRIVIAL</span></a><nav class="nav-links"><a href="index.html">Главная</a><a href="profile.html">Профиль</a></nav><div class="header-actions"><a class="btn btn-small" href="profile.html">Назад</a></div></div></header><main class="profile-page"><div class="container"><div class="profile-head"><div><span class="eyebrow">Creator tools</span><h1>Админ-панель</h1><p>Лицензионные ключи и состояние сервиса.</p></div></div><section class="profile-panel"><div class="admin-grid"><article class="admin-card"><h3>Создать ключ</h3><form id="keyCreator" class="form-grid"><div class="field"><label>Срок</label><select name="duration"><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="90">90 дней</option><option value="365">365 дней</option></select></div><button class="btn btn-primary" type="submit">Создать ключ</button></form><div class="generated-key" id="generatedKey">Ключ появится здесь</div><p class="status-message" id="adminStatus"></p></article><article class="admin-card"><h3>Статистика</h3><div class="details-list"><div class="detail-row"><span>Пользователи</span><strong id="statUsers">—</strong></div><div class="detail-row"><span>Активные подписки</span><strong id="statActive">—</strong></div><div class="detail-row"><span>Свободные ключи</span><strong id="statKeys">—</strong></div></div></article></div></section></div></main><script src="js/api.js"></script><script src="js/auth-check.js"></script><script src="js/header.js"></script><script>
(async()=>{try{const p=await TrivialAPI.api('profile');if(!['creator','admin'].includes(String(p.user.role).toLowerCase()))location.replace('profile.html');const s=await TrivialAPI.api('stats');statUsers.textContent=s.users;statActive.textContent=s.activeSubscriptions;statKeys.textContent=s.unusedKeys}catch(e){adminStatus.textContent=e.message;adminStatus.className='status-message error'}})();
keyCreator.addEventListener('submit',async e=>{e.preventDefault();adminStatus.textContent='Создаём…';try{const data=await TrivialAPI.api('create-key',{method:'POST',body:JSON.stringify({duration:Number(e.currentTarget.duration.value)})});generatedKey.textContent=data.key;adminStatus.textContent='Ключ создан';adminStatus.className='status-message success'}catch(error){adminStatus.textContent=error.message;adminStatus.className='status-message error'}});
</script></body></html>
