<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель — Trivial</title><link rel="icon" href="img/logo.png"><link rel="stylesheet" href="css/header.css"><link rel="stylesheet" href="css/main/profile.css"></head><body data-auth-required><header class="site-header">
  <div class="header-shell">
    <a class="brand" href="index.html"><img src="img/logo.png" alt="Логотип Trivial"><span>TRIVIAL</span></a>
    <nav class="nav-links" aria-label="Основная навигация">
      <a href="index.html">Главная</a><a href="index.html#features">Возможности</a><a href="purchase.html">Покупка</a><a href="index.html#showcase">Обзор</a>
    </nav>
    <div class="header-actions"><a class="btn btn-small desktop-only" data-account-link href="signin.html">Войти</a><button class="menu-toggle" aria-label="Открыть меню" aria-expanded="false"><span></span><span></span></button></div>
  </div>
</header><main class="profile-page"><div class="container"><div class="profile-head"><div><span class="eyebrow">Creator tools</span><h1>Админ-панель</h1><p>Создание ключей и проверка состояния сервисов.</p></div><a class="btn" href="profile.html">Вернуться в профиль</a></div><section class="profile-panel"><div class="admin-grid"><article class="admin-card"><h3>Создать лицензионный ключ</h3><form id="keyCreator" class="form-grid"><div class="field"><label>Срок</label><select name="duration"><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="90">90 дней</option></select></div><button class="btn btn-primary" type="submit">Создать ключ</button></form><div class="generated-key" id="generatedKey">Ключ появится здесь</div><p class="status-message" id="adminStatus"></p></article><article class="admin-card"><h3>Статус проекта</h3><div class="details-list"><div class="detail-row"><span>API</span><strong>Подключено</strong></div><div class="detail-row"><span>База данных</span><strong>DATABASE_URL</strong></div><div class="detail-row"><span>Среда</span><strong>Vercel / Node.js</strong></div></div></article></div></section></div></main><script src="js/auth-check.js"></script><script src="js/header.js"></script><script>document.getElementById('keyCreator').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('adminStatus');try{const username=localStorage.getItem('trivial_username');const response=await fetch('/api/create-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,duration:e.currentTarget.duration.value})});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message||'Ошибка');document.getElementById('generatedKey').textContent=data.key;status.textContent='Ключ создан';status.className='status-message success'}catch(error){status.textContent=error.message;status.className='status-message error'}});</script></body></html>
