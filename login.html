<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080b"><title>Вход — Decide Visuals</title><link rel="icon" href="/img/decide-mark-v3.png?v=4"><link rel="stylesheet" href="/css/decide-v4.css"></head>
<body class="inner-page">
<a class="auth-back" href="/">На главную</a>
<main class="auth-page"><section class="auth-shell auth-minimal reveal"><div class="auth-form-wrap">
<div class="auth-brand-center"><a class="brand" href="/"><img src="/img/decide-mark-v3.png?v=4" alt=""><span>Decide Visuals</span></a></div>
<h1>Вход</h1><p>Войдите в аккаунт, чтобы управлять лицензией и загрузкой.</p>
<form id="signinForm" class="form-grid">
<div class="field"><label for="login">Логин или e-mail</label><input id="login" name="login" autocomplete="username" required placeholder="Введите логин или e-mail"></div>
<div class="field"><label for="password">Пароль</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Введите пароль"><button class="password-toggle" type="button" aria-label="Показать пароль">●</button></div></div>
<button class="btn btn-primary btn-block" type="submit">Войти</button><p class="status-message" id="formStatus" aria-live="polite"></p></form>
<p class="auth-switch">Нет аккаунта? <a href="/signup">Создать</a></p><div class="auth-note">Private access</div>
</div></section></main>
<script src="/js/api.js"></script><script src="/js/form-anim.js"></script><script src="/js/auth.js"></script><script src="/js/perfomance.js"></script></body></html>
